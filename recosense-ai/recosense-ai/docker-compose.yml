# One-command local stack:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recosense
      POSTGRES_PASSWORD: recosense
      POSTGRES_DB: recosense
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recosense"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recosense:recosense@db:5432/recosense
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-local-secret-change-me}
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
